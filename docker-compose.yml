services:
  db:
    image: postgres:16.15-alpine
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-admission}
      POSTGRES_USER: ${POSTGRES_USER:-admission}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admission}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      # -h forces TCP: the image's temporary init server listens only on a unix
      # socket, so a socket check would report healthy before init has finished.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  backend:
    build:
      context: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Default: ${DB_CONNECTION_STRING:-Host=db;Port=5432;Database=${POSTGRES_DB:-admission};Username=${POSTGRES_USER:-admission};Password=${POSTGRES_PASSWORD:-admission};Maximum Pool Size=40}
      HOLD_DURATION_SECONDS: ${HOLD_DURATION_SECONDS:-600}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    ports:
      - "0.0.0.0:8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  frontend:
    build:
      context: ./frontend
    environment:
      API_BASE_URL: ${API_BASE_URL:-http://localhost:8080}
    ports:
      - "0.0.0.0:3000:3000"

  # ---------------------------------------------------------------------------
  # "test" profile: started only with --profile test. It has its own database on
  # tmpfs and publishes no ports, so it never touches the services above or
  # their data. Run with:
  #   docker compose --profile test run --rm --build backend-tests
  # ---------------------------------------------------------------------------
  db-test:
    profiles: ["test"]
    image: postgres:16.15-alpine
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      POSTGRES_DB: admission_test
      POSTGRES_USER: admission_test
      POSTGRES_PASSWORD: admission_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  api-a: &test-api
    profiles: ["test"]
    build:
      context: ./backend
    depends_on:
      db-test:
        condition: service_healthy
    environment:
      ConnectionStrings__Default: Host=db-test;Port=5432;Database=admission_test;Username=admission_test;Password=admission_test;Maximum Pool Size=40
      HOLD_DURATION_SECONDS: 60
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  api-b:
    <<: *test-api

  api-short:
    <<: *test-api
    environment:
      ConnectionStrings__Default: Host=db-test;Port=5432;Database=admission_test;Username=admission_test;Password=admission_test;Maximum Pool Size=40
      HOLD_DURATION_SECONDS: 2

  backend-tests:
    profiles: ["test"]
    build:
      context: ./backend
      target: test
    depends_on:
      api-a:
        condition: service_healthy
      api-b:
        condition: service_healthy
      api-short:
        condition: service_healthy
    environment:
      API_A_URL: http://api-a:8080
      API_B_URL: http://api-b:8080
      API_SHORT_URL: http://api-short:8080

volumes:
  db-data:
